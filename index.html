<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%23F0EEE8' stroke-width='4'/><circle cx='50' cy='50' r='14' fill='%23F0EEE8'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Akshat Ambasta — AI Student, Software Builder & Systems Explorer. Monochromatic, particle-driven digital engineering portfolio." />
    <meta name="theme-color" content="#050505" />
    <title>AKSHAT AMBASTA — SIGNAL / SYSTEM</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-[#F0EEE8] selection:bg-[#F0EEE8]/20 selection:text-[#F0EEE8] overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback redirect for static CDN environments serving repository root
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !window.location.pathname.includes('/dist')) {
            window.location.replace('./dist/' + window.location.search + window.location.hash);
          }
        }, 300);
      });
    </script>
  </body>
</html>
